# Stepper node parameters (all six ESP32 stepper channels).
# StepperMove (pump/flush/centrifuge move) passes distance, speed, accel in the firmware's
# units for that motor: pump/flush pulses, centrifuge revolutions / RPM / RPM/s.
steppers_node:
  ros__parameters:
    port: /dev/esp_steppers
    baud: 115200
    dry_run: false
    motor_name: pump
    # Cache handover (/astrobiology/gantry/handover): after homing, X then Y go here (mm),
    # then Y and X home again.  Y 105 is beyond the scan's travel_max; it's the handover spot.
    handover_x_mm: 53.0
    handover_y_mm: 105.0
    # Dock lid (/astrobiology/gantry/lid): home all, X then Y go here (mm), then home X, home Y.
    # Undock lid (/astrobiology/gantry/unlid): home all, Y to unlid_y_start_mm, X to
    # unlid_x_mm, Y to unlid_y_mm, then home X.
    # X 160 is beyond the scan's travel_max; it's the lid dock.
    lid_x_mm: 160.0
    lid_y_mm: 6.0
    unlid_x_mm: 160.0
    unlid_y_start_mm: 6.0
    unlid_y_mm: 0.0
    # Dock pipes (/astrobiology/gantry/dock_pipes): home all, X, then Y, then Z go here (mm).
    # Z stays raised at pipes_z_mm until undocked; undock = /astrobiology/gantry/home
    # (it homes Z first, so the tray drops off the pipes before X and Y move).
    pipes_x_mm: 104.0
    pipes_y_mm: 1.0
    pipes_z_mm: 47.0
    # gantry/{x,y,z}/move (MoveAxis, mm): jog speed and acceleration
    jog_speed_mm_s: 5.0
    jog_accel_mm_s2: 10.0
    # Dispensing pumps (/astrobiology/<pump|flush>/dispense):
    # pump = extraction (firmware p), flush = dosing (firmware f).
    # For now every dispense request (any volume_ml, or "{}") sends the fixed default_pulses dose:
    #   flush -> g1 f -100000 30000 5000      pump -> g1 p -150000 20000 5000
    # Set default_pulses: 0 to dispense volume_ml * pulses_per_ml instead (same speed/accel).
    # pulses_per_ml is a PLACEHOLDER (TODO: calibrate): run the default dose into a
    # measuring cylinder; pulses_per_ml = default_pulses / mL collected.
    # direction: cw | ccw (ccw = negative distance).
    flush:
      default_pulses: 100000
      pulses_per_ml: 1000.0
      speed_hz: 30000
      accel_hz2: 5000
      direction: ccw
      max_ml: 50.0
    pump:
      default_pulses: 150000
      pulses_per_ml: 1000.0
      speed_hz: 20000
      accel_hz2: 5000
      direction: ccw
      max_ml: 50.0
    # Centrifuge (/astrobiology/centrifuge/spin: rpm for duration_s) on firmware motor c
    centrifuge:
      accel_rpm_s: 100.0     # ramp up and down
      max_rpm: 3000.0        # spin requests above this are refused (firmware limit 3750)
    # Carousel (/astrobiology/carousel/rotate: step_deg CW/CCW), the same motor c
    carousel:
      allowed_steps_deg: [1.0, 5.0, 60.0]
      speed_rpm: 10.0
      accel_rpm_s: 20.0
      # Motor revolutions per carousel revolution.  2.0 for now: the centrifuge driver
      # microsteps at twice what the firmware assumes (1600 steps/rev), so each firmware
      # "rev" only turns the motor half a turn.  Set back to 1.0 once the firmware's
      # steps/unit for c matches the driver.
      gear_ratio: 2.0
      cw_positive: true      # false if CW turns the carousel the wrong way
