# Pump node parameters.
# The ESP32 firmware uses FastAccelStepper: speed in steps/s, accel in steps/s².
# Dispense time = volume_ml * steps_per_ml / speed_steps_s.
# steps_per_ml must be calibrated per pump.
pump_node:
  ros__parameters:
    port: /dev/ttyUSB1
    baud: 115200
    dry_run: true                # safe default — set false when hardware is connected

    pump1:
      speed_steps_s: 33333      # ~1/30µs per step
      accel_steps_s2: 400
      direction: cw
      steps_per_ml: 1000.0      # placeholder — calibrate
      max_volume_ml: 20.0
    pump2:
      speed_steps_s: 20000      # ~1/50µs per step
      accel_steps_s2: 400
      direction: cw
      steps_per_ml: 1000.0      # placeholder — calibrate
      max_volume_ml: 20.0
    pump3:
      speed_steps_s: 5000       # ~1/200µs per step
      accel_steps_s2: 400
      direction: cw
      steps_per_ml: 1000.0      # placeholder — calibrate
      max_volume_ml: 20.0
